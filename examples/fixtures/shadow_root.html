<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AutoWK Shadow Fixture</title>
</head>
<body>
  <div id="shadow-host" data-shadow-host></div>
  <script>
    const host = document.querySelector("#shadow-host");
    const root = host.attachShadow({mode: "open"});
    root.innerHTML = "<span id='shadow-value'>Shadow text</span><button id='shadow-button'>Shadow button</button>";
  </script>
</body>
</html>
